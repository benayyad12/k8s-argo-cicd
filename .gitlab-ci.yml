stages:
  - build
  - deploy

variables:
  IMAGE: "${JFROG_REGISTRY}/${APP_NAME}"
  TAG: "${CI_COMMIT_SHORT_SHA}"

build:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    - echo "$JFROG_PASSWORD" | docker login "$JFROG_REGISTRY" -u "$JFROG_USER" --password-stdin
  script:
    - docker build -t "$IMAGE:$TAG" .
    - docker push "$IMAGE:$TAG"
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main"'

.gitops-deploy:
  stage: deploy
  image: alpine:3.20
  before_script:
    - apk add --no-cache git curl
    - curl -sSL -o /usr/local/bin/argocd https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
    - chmod +x /usr/local/bin/argocd
    - argocd login "$ARGOCD_SERVER" --username "$ARGOCD_USER" --password "$ARGOCD_PASSWORD" --grpc-web
    - git config user.email "gitlab-ci@local"
    - git config user.name "gitlab-ci"
    - git remote set-url origin "https://oauth2:${GITOPS_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
  script:
    - git fetch origin "$CI_COMMIT_BRANCH" && git checkout -B "$CI_COMMIT_BRANCH" "origin/$CI_COMMIT_BRANCH"
    - if [ -z "$TAG" ]; then TAG=$(awk '/^  tag:/{print $2}' helm/values-$SRC.yaml | tr -d '"'); fi
    - sed -i "s|^  tag:.*|  tag: \"$TAG\"|" helm/values-$ENV.yaml
    - git commit -am "deploy $ENV: $TAG [skip ci]" || echo "rien à commiter"
    - git pull --rebase origin "$CI_COMMIT_BRANCH"
    - git push origin HEAD:$CI_COMMIT_BRANCH
    - argocd app sync "$APP_NAME-$ENV" --prune
    - argocd app wait "$APP_NAME-$ENV" --health --timeout 300

deploy-dev:
  extends: .gitops-deploy
  needs: [build]
  variables:
    ENV: dev
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'

deploy-int:
  extends: .gitops-deploy
  variables:
    ENV: int
    SRC: dev
    TAG: ""
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
      when: manual

deploy-uat:
  extends: .gitops-deploy
  variables:
    ENV: uat
    SRC: dev
    TAG: ""
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
      when: manual

deploy-prd:
  extends: .gitops-deploy
  variables:
    ENV: prd
    SRC: uat
    TAG: ""
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
