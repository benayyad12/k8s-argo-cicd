# .gitlab-ci.yml - déploiement simple via ArgoCD (image déjà construite sur JFrog)
stages:
  - deploy

.argocd-sync:
  stage: deploy
  image: argoproj/argocd:latest
  script:
    - argocd login "$ARGOCD_SERVER" --username "$ARGOCD_USER" --password "$ARGOCD_PASSWORD" --grpc-web
    - argocd app sync "$APP_NAME-$ENV" --prune
    - argocd app wait "$APP_NAME-$ENV" --health --timeout 300

deploy-dev:
  extends: .argocd-sync
  variables:
    ENV: dev
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'

deploy-int:
  extends: .argocd-sync
  variables:
    ENV: int
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
      when: manual

deploy-uat:
  extends: .argocd-sync
  variables:
    ENV: uat
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual

deploy-prod:
  extends: .argocd-sync
  variables:
    ENV: prod
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
