stages:
  - build
  - test
  - scan
  - deploy-dev
  - deploy-int
  - deploy-uat
  - deploy-prod

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  REGISTRY: "${JFROG_REGISTRY}"
  REGISTRY_USER: "${JFROG_USER}"
  REGISTRY_PASSWORD: "${JFROG_PASSWORD}"
  SONAR_HOST_URL: "${SONARQUBE_URL}"
  SONAR_LOGIN: "${SONARQUBE_TOKEN}"

# Load environment-specific variables
.load_env_vars: &load_env_vars
  before_script:
    - export ENV_FILE="group_vars/${CI_COMMIT_BRANCH}.yml"
    - if [ ! -f "$ENV_FILE" ]; then export ENV_FILE="group_vars/dev.yml"; fi
    - source <(grep = "$ENV_FILE" | sed 's/ //g')

# Build Docker image and push to JFrog
build:docker:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_TLS_VERIFY: 0
  script:
    - export BUILD_TAG="${CI_COMMIT_SHORT_SHA}"
    - export IMAGE_NAME="${REGISTRY}/${CI_PROJECT_NAME}"
    - docker login -u "${REGISTRY_USER}" -p "${REGISTRY_PASSWORD}" "${REGISTRY}"
    - docker build -t "${IMAGE_NAME}:${BUILD_TAG}" -t "${IMAGE_NAME}:latest" .
    - docker push "${IMAGE_NAME}:${BUILD_TAG}"
    - docker push "${IMAGE_NAME}:latest"
    - echo "Image pushed to JFrog: ${IMAGE_NAME}:${BUILD_TAG}"
  artifacts:
    reports:
      dotenv: build.env
  only:
    - main
    - develop
    - /^release\/.*$/
    - /^hotfix\/.*$/

# Unit tests
test:unit:
  stage: test
  image: python:3.11
  before_script:
    - pip install -r requirements.txt
    - pip install pytest pytest-cov pytest-xdist
  script:
    - pytest tests/ -v --cov=app --cov-report=xml --cov-report=html
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - htmlcov/
  coverage: '/TOTAL.*\s+(\d+%)$/'
  only:
    - main
    - develop
    - merge_requests

# Code quality scan with SonarQube
scan:sonarqube:
  stage: scan
  image: sonarsource/sonar-scanner-cli:latest
  before_script:
    - export BUILD_TAG="${CI_COMMIT_SHORT_SHA}"
  script:
    - sonar-scanner
        -Dsonar.projectKey="${CI_PROJECT_NAME}"
        -Dsonar.projectName="${CI_PROJECT_NAME}"
        -Dsonar.sources=app/
        -Dsonar.exclusions="**/*test*,**/migrations/**"
        -Dsonar.host.url="${SONAR_HOST_URL}"
        -Dsonar.login="${SONAR_LOGIN}"
        -Dsonar.scm.provider=git
        -Dsonar.branch.name="${CI_COMMIT_BRANCH}"
  only:
    - main
    - develop
    - merge_requests

# ============= DEPLOYMENT STAGES VIA ARGOCD =============

# Deploy to DEV (Auto on develop branch)
deploy:dev:
  <<: *load_env_vars
  stage: deploy-dev
  image: alpine:latest
  before_script:
    - apk add --no-cache curl
    - export IMAGE_TAG="${CI_COMMIT_SHORT_SHA}"
    - export ARGOCD_APP_NAME="${CI_PROJECT_NAME}-dev"
  script:
    - echo "🚀 Triggering ArgoCD deployment for DEV"
    - |
      curl -sSL -X POST \
        -H "Authorization: Bearer ${ARGOCD_TOKEN}" \
        "${ARGOCD_SERVER}/api/v1/applications/${ARGOCD_APP_NAME}/sync" \
        -d '{"syncPolicy":{"automated":{"prune":true,"selfHeal":true}}}' \
        -H "Content-Type: application/json"
    - echo "✅ DEV deployment triggered via ArgoCD"
  environment:
    name: dev
    kubernetes:
      namespace: dev
  only:
    - develop
  when: on_success

# Deploy to INT (Manual approval from DEV)
deploy:int:
  <<: *load_env_vars
  stage: deploy-int
  image: alpine:latest
  before_script:
    - apk add --no-cache curl
    - export IMAGE_TAG="${CI_COMMIT_SHORT_SHA}"
    - export ARGOCD_APP_NAME="${CI_PROJECT_NAME}-int"
  script:
    - echo "🚀 Triggering ArgoCD deployment for INT"
    - |
      curl -sSL -X POST \
        -H "Authorization: Bearer ${ARGOCD_TOKEN}" \
        "${ARGOCD_SERVER}/api/v1/applications/${ARGOCD_APP_NAME}/sync" \
        -d '{"syncPolicy":{"automated":{"prune":true,"selfHeal":true}}}' \
        -H "Content-Type: application/json"
    - echo "✅ INT deployment triggered via ArgoCD"
  environment:
    name: int
    kubernetes:
      namespace: int
  only:
    - develop
  when: manual

# Deploy to UAT (Manual approval from develop)
deploy:uat:
  <<: *load_env_vars
  stage: deploy-uat
  image: alpine:latest
  before_script:
    - apk add --no-cache curl
    - export IMAGE_TAG="${CI_COMMIT_SHORT_SHA}"
    - export ARGOCD_APP_NAME="${CI_PROJECT_NAME}-uat"
  script:
    - echo "🚀 Triggering ArgoCD deployment for UAT"
    - |
      curl -sSL -X POST \
        -H "Authorization: Bearer ${ARGOCD_TOKEN}" \
        "${ARGOCD_SERVER}/api/v1/applications/${ARGOCD_APP_NAME}/sync" \
        -d '{"syncPolicy":{"automated":{"prune":true,"selfHeal":true}}}' \
        -H "Content-Type: application/json"
    - echo "✅ UAT deployment triggered via ArgoCD"
  environment:
    name: uat
    kubernetes:
      namespace: uat
  only:
    - main
  when: manual

# Deploy to PROD (Manual approval + merge to main required)
deploy:prod:
  <<: *load_env_vars
  stage: deploy-prod
  image: alpine:latest
  before_script:
    - apk add --no-cache curl
    - export IMAGE_TAG="${CI_COMMIT_SHORT_SHA}"
    - export ARGOCD_APP_NAME="${CI_PROJECT_NAME}-prod"
  script:
    - echo "🚀 Triggering ArgoCD deployment for PROD"
    - |
      curl -sSL -X POST \
        -H "Authorization: Bearer ${ARGOCD_TOKEN}" \
        "${ARGOCD_SERVER}/api/v1/applications/${ARGOCD_APP_NAME}/sync" \
        -d '{"syncPolicy":{"automated":{"prune":true,"selfHeal":true}}}' \
        -H "Content-Type: application/json"
    - echo "✅ PROD deployment triggered via ArgoCD - $(date)"
  environment:
    name: prod
    kubernetes:
      namespace: prod
  only:
    - main
  when: manual
