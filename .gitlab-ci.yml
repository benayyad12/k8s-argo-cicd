# .gitlab-ci.yml - sync ArgoCD par environnement (image déjà sur JFrog)
# Environnements : d, int, uat, prd
# Variables GitLab : ARGOCD_SERVER, ARGOCD_USER, ARGOCD_PASSWORD, APP_NAME

stages:
  - deploy

.argocd-sync:
  stage: deploy
  image: argoproj/argocd:latest
  script:
    - argocd login "$ARGOCD_SERVER" --username "$ARGOCD_USER" --password "$ARGOCD_PASSWORD" --grpc-web
    - argocd app sync "$APP_NAME-$ENV" --prune
    - argocd app wait "$APP_NAME-$ENV" --health --timeout 300

deploy-d:
  extends: .argocd-sync
  variables:
    ENV: d
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'

deploy-int:
  extends: .argocd-sync
  variables:
    ENV: int
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
      when: manual

deploy-uat:
  extends: .argocd-sync
  variables:
    ENV: uat
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual

deploy-prd:
  extends: .argocd-sync
  variables:
    ENV: prd
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
