stages:
  - build
  - test
  - scan
  - deploy-dev
  - deploy-int
  - deploy-uat
  - deploy-prod

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  REGISTRY: "${JFROG_REGISTRY}"
  REGISTRY_USER: "${JFROG_USER}"
  REGISTRY_PASSWORD: "${JFROG_PASSWORD}"
  SONAR_HOST_URL: "${SONARQUBE_URL}"
  SONAR_LOGIN: "${SONARQUBE_TOKEN}"

# Load environment-specific variables
.load_env_vars: &load_env_vars
  before_script:
    - export ENV_FILE="group_vars/${CI_COMMIT_BRANCH}.yml"
    - if [ ! -f "$ENV_FILE" ]; then export ENV_FILE="group_vars/dev.yml"; fi
    - source <(grep = "$ENV_FILE" | sed 's/ //g')

# Build Docker image
build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_TLS_VERIFY: 0
  script:
    - export BUILD_TAG="${CI_COMMIT_SHORT_SHA}"
    - export IMAGE_NAME="${REGISTRY}/${CI_PROJECT_NAME}"
    - docker login -u "${REGISTRY_USER}" -p "${REGISTRY_PASSWORD}" "${REGISTRY}"
    - docker build -t "${IMAGE_NAME}:${BUILD_TAG}" -t "${IMAGE_NAME}:latest" .
    - docker push "${IMAGE_NAME}:${BUILD_TAG}"
    - docker push "${IMAGE_NAME}:latest"
    - echo "Image pushed: ${IMAGE_NAME}:${BUILD_TAG}"
  artifacts:
    reports:
      dotenv: build.env
  only:
    - main
    - develop
    - /^release\/.*$/
    - /^hotfix\/.*$/

# Unit tests
test:unit:
  stage: test
  image: python:3.11
  before_script:
    - pip install -r requirements.txt
    - pip install pytest pytest-cov pytest-xdist
  script:
    - pytest tests/ -v --cov=app --cov-report=xml --cov-report=html
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - htmlcov/
  coverage: '/TOTAL.*\s+(\d+%)$/'
  only:
    - main
    - develop
    - merge_requests

# Code quality scan with SonarQube
scan:sonarqube:
  stage: scan
  image: sonarsource/sonar-scanner-cli:latest
  before_script:
    - export BUILD_TAG="${CI_COMMIT_SHORT_SHA}"
  script:
    - sonar-scanner
        -Dsonar.projectKey="${CI_PROJECT_NAME}"
        -Dsonar.projectName="${CI_PROJECT_NAME}"
        -Dsonar.sources=app/
        -Dsonar.exclusions="**/*test*,**/migrations/**"
        -Dsonar.host.url="${SONAR_HOST_URL}"
        -Dsonar.login="${SONAR_LOGIN}"
        -Dsonar.scm.provider=git
        -Dsonar.branch.name="${CI_COMMIT_BRANCH}"
  only:
    - main
    - develop
    - merge_requests

# SAST Security scanning
scan:sast:
  stage: scan
  image: python:3.11
  before_script:
    - pip install bandit safety
  script:
    - bandit -r app/ -f json -o bandit-report.json || true
    - safety check --json > safety-report.json || true
  artifacts:
    reports:
      sast: bandit-report.json
    paths:
      - bandit-report.json
      - safety-report.json
  only:
    - main
    - develop
    - merge_requests

# ============= DEPLOYMENT STAGES =============

# Deploy to DEV (Auto on develop branch)
deploy:dev:
  <<: *load_env_vars
  stage: deploy-dev
  image: alpine/helm:latest
  script:
    - echo "Deploying to DEV environment"
    - helm repo add jfrog "${JFROG_HELM_REPO}"
    - helm repo update
    - helm upgrade --install "${APP_NAME}" ./helm
        --namespace "${KUBE_NAMESPACE_DEV}"
        --create-namespace
        -f helm/values-dev.yml
        --set image.repository="${REGISTRY}/${CI_PROJECT_NAME}"
        --set image.tag="${CI_COMMIT_SHORT_SHA}"
        --kubeconfig="${KUBE_CONFIG_DEV}"
    - echo "DEV deployment completed"
  environment:
    name: dev
    kubernetes:
      namespace: "${KUBE_NAMESPACE_DEV}"
  only:
    - develop
  when: on_success

# Deploy to INT (Manual approval from DEV)
deploy:int:
  <<: *load_env_vars
  stage: deploy-int
  image: alpine/helm:latest
  script:
    - echo "Deploying to INT environment"
    - helm repo add jfrog "${JFROG_HELM_REPO}"
    - helm repo update
    - helm upgrade --install "${APP_NAME}" ./helm
        --namespace "${KUBE_NAMESPACE_INT}"
        --create-namespace
        -f helm/values-int.yml
        --set image.repository="${REGISTRY}/${CI_PROJECT_NAME}"
        --set image.tag="${CI_COMMIT_SHORT_SHA}"
        --kubeconfig="${KUBE_CONFIG_INT}"
    - echo "INT deployment completed"
  environment:
    name: int
    kubernetes:
      namespace: "${KUBE_NAMESPACE_INT}"
  only:
    - develop
  when: manual

# Deploy to UAT (Manual approval from INT)
deploy:uat:
  <<: *load_env_vars
  stage: deploy-uat
  image: alpine/helm:latest
  script:
    - echo "Deploying to UAT environment"
    - helm repo add jfrog "${JFROG_HELM_REPO}"
    - helm repo update
    - helm upgrade --install "${APP_NAME}" ./helm
        --namespace "${KUBE_NAMESPACE_UAT}"
        --create-namespace
        -f helm/values-uat.yml
        --set image.repository="${REGISTRY}/${CI_PROJECT_NAME}"
        --set image.tag="${CI_COMMIT_SHORT_SHA}"
        --kubeconfig="${KUBE_CONFIG_UAT}"
    - echo "UAT deployment completed"
  environment:
    name: uat
    kubernetes:
      namespace: "${KUBE_NAMESPACE_UAT}"
  only:
    - main
  when: manual

# Deploy to PROD (Manual approval + merge to main)
deploy:prod:
  <<: *load_env_vars
  stage: deploy-prod
  image: alpine/helm:latest
  script:
    - echo "Deploying to PROD environment"
    - helm repo add jfrog "${JFROG_HELM_REPO}"
    - helm repo update
    - helm upgrade --install "${APP_NAME}" ./helm
        --namespace "${KUBE_NAMESPACE_PROD}"
        --create-namespace
        -f helm/values-prod.yml
        --set image.repository="${REGISTRY}/${CI_PROJECT_NAME}"
        --set image.tag="${CI_COMMIT_SHORT_SHA}"
        --kubeconfig="${KUBE_CONFIG_PROD}"
    - echo "PROD deployment completed - $(date)"
  environment:
    name: prod
    kubernetes:
      namespace: "${KUBE_NAMESPACE_PROD}"
  only:
    - main
  when: manual

# Update ArgoCD apps
.argocd_sync: &argocd_sync
  image: alpine:latest
  before_script:
    - apk add --no-cache curl
    - export ARGOCD_APP_NAME="${CI_PROJECT_NAME}-${CI_ENVIRONMENT_NAME}"
  script:
    - |
      curl -sSL -X POST \
        -H "Authorization: Bearer ${ARGOCD_TOKEN}" \
        "${ARGOCD_SERVER}/api/v1/applications/${ARGOCD_APP_NAME}/sync" \
        -d '{"syncPolicy":{"automated":{"prune":true,"selfHeal":true}}}' \
        -H "Content-Type: application/json"
    - echo "ArgoCD sync triggered for ${ARGOCD_APP_NAME}"

sync:argocd:dev:
  <<: *argocd_sync
  stage: deploy-dev
  environment:
    name: dev
  only:
    - develop
  when: on_success

sync:argocd:int:
  <<: *argocd_sync
  stage: deploy-int
  environment:
    name: int
  only:
    - develop
  when: manual

sync:argocd:uat:
  <<: *argocd_sync
  stage: deploy-uat
  environment:
    name: uat
  only:
    - main
  when: manual

sync:argocd:prod:
  <<: *argocd_sync
  stage: deploy-prod
  environment:
    name: prod
  only:
    - main
  when: manual
