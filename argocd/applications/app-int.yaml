# ArgoCD Application - env int
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: my-app-int
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/benayyad12/k8s-argo-cicd.git
    targetRevision: develop
    path: helm
    helm:
      valueFiles:
        - values.yaml
        - values-int.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: int
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
