# ArgoCD Application for INT environment
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: python-app-int
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/benayyad12/k8s-argo-cicd.git
    targetRevision: develop
    path: helm
    helm:
      releaseName: python-app-int
      values: |
        replicaCount: 2
        image:
          registry: jfrog.artifactory.com
          repository: python-app
          tag: "staging"
          pullPolicy: IfNotPresent
        service:
          type: ClusterIP
          port: 80
        ingress:
          enabled: true
          className: "nginx"
          annotations:
            cert-manager.io/cluster-issuer: "letsencrypt-staging"
            nginx.ingress.kubernetes.io/rate-limit: "100"
          hosts:
            - host: app-int.example.com
              paths:
                - path: /
                  pathType: Prefix
          tls:
            - secretName: python-app-int-tls
              hosts:
                - app-int.example.com
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 250m
            memory: 512Mi
        autoscaling:
          enabled: true
          minReplicas: 2
          maxReplicas: 5
          targetCPUUtilizationPercentage: 70
        vault:
          enabled: true
          role: "int-app"
          address: "http://vault.vault.svc.cluster.local:8200"
        env:
          LOG_LEVEL: "INFO"
          ENVIRONMENT: "int"
          API_TIMEOUT: "60"
          DEBUG: "false"
          DATABASE_POOL_SIZE: "20"
          CACHE_TTL: "3600"
  destination:
    server: https://kubernetes.default.svc
    namespace: int
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
