# ArgoCD Application - env prd
# Nom ArgoCD = <APP_NAME>-prd (APP_NAME doit correspondre à my-app ou au nom réel)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: my-app-prd
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/benayyad12/k8s-argo-cicd.git
    targetRevision: main
    path: helm
    helm:
      valueFiles:
        - values.yaml
        - values-prd.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: prd
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
