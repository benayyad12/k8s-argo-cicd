# ArgoCD Application for UAT environment
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: python-app-uat
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/benayyad12/k8s-argo-cicd.git
    targetRevision: main
    path: helm
    helm:
      releaseName: python-app-uat
      values: |
        replicaCount: 2
        image:
          registry: jfrog.artifactory.com
          repository: python-app
          tag: "staging"
          pullPolicy: IfNotPresent
        service:
          type: ClusterIP
          port: 80
        ingress:
          enabled: true
          className: "nginx"
          annotations:
            cert-manager.io/cluster-issuer: "letsencrypt-prod"
            nginx.ingress.kubernetes.io/rate-limit: "200"
            nginx.ingress.kubernetes.io/ssl-redirect: "true"
          hosts:
            - host: app-uat.example.com
              paths:
                - path: /
                  pathType: Prefix
          tls:
            - secretName: python-app-uat-tls
              hosts:
                - app-uat.example.com
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 250m
            memory: 512Mi
        autoscaling:
          enabled: true
          minReplicas: 2
          maxReplicas: 5
          targetCPUUtilizationPercentage: 75
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          fsReadOnlyRootFilesystem: true
        vault:
          enabled: true
          role: "uat-app"
          address: "https://vault.vault.svc.cluster.local:8200"
        env:
          LOG_LEVEL: "INFO"
          ENVIRONMENT: "uat"
          API_TIMEOUT: "60"
          DEBUG: "false"
          DATABASE_POOL_SIZE: "30"
          CACHE_TTL: "7200"
          ENABLE_METRICS: "true"
          ENABLE_TRACING: "true"
          TRACING_SAMPLE_RATE: "0.1"
  destination:
    server: https://kubernetes.default.svc
    namespace: uat
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
