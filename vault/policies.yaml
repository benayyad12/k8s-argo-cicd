# Vault Configuration for Secret Management
# Efficient and production-ready

---
# Vault Auth Policy for DEV
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-policy-dev
  namespace: vault
data:
  dev-app.hcl: |
    path "secret/data/dev/*" {
      capabilities = ["read", "list"]
    }
    path "database/creds/dev-app" {
      capabilities = ["read"]
    }

