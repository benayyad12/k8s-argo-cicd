# Environment-specific Helm values override for PROD

replicaCount: 3

image:
  registry: jfrog.artifactory.com
  repository: python-app
  tag: stable
  pullPolicy: IfNotPresent

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/rate-limit: "1000"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  hosts:
    - host: app.example.com
      paths:
        - path: /
          pathType: Prefix
    - host: api.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: python-app-prod-tls
      hosts:
        - app.example.com
        - api.example.com

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsReadOnlyRootFilesystem: true

nodeSelector:
  workload: production

affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values:
                - python-app
        topologyKey: kubernetes.io/hostname

env:
  LOG_LEVEL: "WARNING"
  ENVIRONMENT: "prod"
  API_TIMEOUT: "120"
  DEBUG: "false"
  DATABASE_POOL_SIZE: "50"
  CACHE_TTL: "10800"
  ENABLE_METRICS: "true"
  ENABLE_TRACING: "true"
  TRACING_SAMPLE_RATE: "0.05"

vault:
  enabled: true
  role: "prod-app"
  address: "https://vault.vault.svc.cluster.local:8200"
