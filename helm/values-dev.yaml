# Environment-specific Helm values override for DEV

replicaCount: 1

image:
  registry: jfrog.artifactory.com
  repository: python-app
  tag: latest
  pullPolicy: Always

env:
  LOG_LEVEL: "DEBUG"
  ENVIRONMENT: "dev"
  API_TIMEOUT: "30"
  DEBUG: "true"
  DATABASE_POOL_SIZE: "5"

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 100m
    memory: 256Mi

probe:
  liveness:
    initialDelaySeconds: 30
  readiness:
    initialDelaySeconds: 5

vault:
  enabled: true
  role: "dev-app"
  address: "http://vault.vault.svc.cluster.local:8200"
