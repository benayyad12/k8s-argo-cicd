# Environment-specific Helm values override for INT

replicaCount: 2

image:
  registry: jfrog.artifactory.com
  repository: python-app
  tag: staging
  pullPolicy: IfNotPresent

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-staging"
    nginx.ingress.kubernetes.io/rate-limit: "100"
  hosts:
    - host: app-int.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: python-app-int-tls
      hosts:
        - app-int.example.com

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 250m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - python-app
          topologyKey: kubernetes.io/hostname

env:
  LOG_LEVEL: "INFO"
  ENVIRONMENT: "int"
  API_TIMEOUT: "60"
  DEBUG: "false"
  DATABASE_POOL_SIZE: "20"
  CACHE_TTL: "3600"

vault:
  enabled: true
  role: "int-app"
  address: "http://vault.vault.svc.cluster.local:8200"
