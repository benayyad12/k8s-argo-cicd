apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config-dev
  namespace: dev
data:
  LOG_LEVEL: "DEBUG"
  ENVIRONMENT: "dev"
  API_TIMEOUT: "30"
  DEBUG: "true"
  VAULT_ADDR: "http://vault.vault.svc.cluster.local:8200"
  VAULT_NAMESPACE: "dev"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config-int
  namespace: int
data:
  LOG_LEVEL: "INFO"
  ENVIRONMENT: "int"
  API_TIMEOUT: "60"
  DEBUG: "false"
  VAULT_ADDR: "http://vault.vault.svc.cluster.local:8200"
  VAULT_NAMESPACE: "int"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config-uat
  namespace: uat
data:
  LOG_LEVEL: "INFO"
  ENVIRONMENT: "uat"
  API_TIMEOUT: "60"
  DEBUG: "false"
  VAULT_ADDR: "http://vault.vault.svc.cluster.local:8200"
  VAULT_NAMESPACE: "uat"
  ENABLE_METRICS: "true"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config-prod
  namespace: prod
data:
  LOG_LEVEL: "WARNING"
  ENVIRONMENT: "prod"
  API_TIMEOUT: "120"
  DEBUG: "false"
  VAULT_ADDR: "https://vault.vault.svc.cluster.local:8200"
  VAULT_NAMESPACE: "prod"
  ENABLE_METRICS: "true"
  ENABLE_TRACING: "true"
