# ConfigMap for INT environment
# Standard config for integration testing
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config-int
  namespace: int
data:
  LOG_LEVEL: "INFO"
  ENVIRONMENT: "int"
  API_TIMEOUT: "60"
  DEBUG: "false"
  VAULT_ADDR: "http://vault.vault.svc.cluster.local:8200"
  VAULT_NAMESPACE: "int"
  DATABASE_POOL_SIZE: "20"
  CACHE_TTL: "3600"
