# Ingress for INT environment
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: python-app-int
  namespace: int
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-staging"
    nginx.ingress.kubernetes.io/rate-limit: "100"
spec:
  ingressClassName: nginx
  tls:
    - secretName: python-app-int-tls
      hosts:
        - app-int.example.com
  rules:
    - host: app-int.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: python-app-int
                port:
                  number: 80
