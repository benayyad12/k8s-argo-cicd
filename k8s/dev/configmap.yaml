# ConfigMap for DEV environment
# Simple, minimal config for development
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config-dev
  namespace: dev
data:
  LOG_LEVEL: "DEBUG"
  ENVIRONMENT: "dev"
  API_TIMEOUT: "30"
  DEBUG: "true"
  VAULT_ADDR: "http://vault.vault.svc.cluster.local:8200"
  VAULT_NAMESPACE: "dev"
  DATABASE_POOL_SIZE: "5"
