# Ingress for UAT environment
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: python-app-uat
  namespace: uat
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/rate-limit: "200"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - secretName: python-app-uat-tls
      hosts:
        - app-uat.example.com
  rules:
    - host: app-uat.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: python-app-uat
                port:
                  number: 80
