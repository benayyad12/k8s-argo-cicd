# Service for UAT environment
apiVersion: v1
kind: Service
metadata:
  name: python-app-uat
  namespace: uat
  labels:
    app: python-app
    env: uat
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: python-app
    env: uat
