# Deployment for UAT environment
# Staging image, 2 replicas, production-like setup with health checks
apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-app-uat
  namespace: uat
  labels:
    app: python-app
    env: uat
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: python-app
      env: uat
  template:
    metadata:
      labels:
        app: python-app
        env: uat
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: python-app-uat
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsReadOnlyRootFilesystem: true
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - python-app
                topologyKey: kubernetes.io/hostname
      containers:
        - name: app
          image: jfrog.artifactory.com/python-app:staging
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: VAULT_ROLE
              value: "uat-app"
            - name: VAULT_TOKEN_FILE
              value: "/var/run/secrets/vault/token"
          envFrom:
            - configMapRef:
                name: app-config-uat
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 0
            periodSeconds: 10
            failureThreshold: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 250m
              memory: 512Mi
          volumeMounts:
            - name: vault-token
              mountPath: /var/run/secrets/vault
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: vault-token
          emptyDir: {}
        - name: tmp
          emptyDir: {}
